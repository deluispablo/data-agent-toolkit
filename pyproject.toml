# Tool configuration only: agents are self-contained script folders, not an
# installable distribution, so there is intentionally no [project] table.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "D",        # pydocstyle (Google convention, see below)
    "UP",       # pyupgrade
    "ANN",      # type annotations
    "B",        # flake8-bugbear
    "BLE",      # blind except
    "C4",       # comprehensions
    "SIM",      # simplify
    "RET",      # return statements
    "PTH",      # prefer pathlib
    "PT",       # pytest style
    "PL",       # pylint
    "RUF",      # ruff-specific
]
ignore = [
    "PLR0913",  # many keyword-only knobs are the public API of inspect_csv
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["csv_inspector", "eval_samples", "generate_samples"]

[tool.ruff.lint.per-file-ignores]
# Tests: literal expectations, white-box helpers, and duck-typed fakes whose
# methods implement well-known protocols (read/readable/seekable, clients).
"tests/**" = ["PLR2004", "PLC2701", "ANN401", "D102", "D107"]
# Fixture catalog: long prose `description`/`notes` strings are data, not code.
"agents/csv_inspector/samples/generate_samples.py" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
mypy_path = "agents/csv_inspector/src,agents/csv_inspector/scripts,agents/csv_inspector/samples,tests"
explicit_package_bases = true
files = [
    "agents/csv_inspector/src",
    "agents/csv_inspector/scripts",
    "agents/csv_inspector/samples",
    "agents/csv_inspector/main_demo.py",
    "tests",
]

[[tool.mypy.overrides]]
module = ["chardet", "chardet.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
