# Weekly, grouped dependency updates. For the uv ecosystem Dependabot only
# refreshes uv.lock (versioning-strategy: lockfile-only): the version ranges
# each agent declares in its pyproject.toml, including [build-system]
# requires, are a published contract and are changed by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    groups:
      python-dependencies:
        patterns: ["*"]
