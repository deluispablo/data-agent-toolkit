# Weekly, grouped dependency updates. For the uv ecosystem Dependabot only
# refreshes uv.lock: the version ranges each agent declares in its
# pyproject.toml are a published contract and are changed by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
