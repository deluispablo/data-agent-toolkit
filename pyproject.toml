# Repository root: a virtual uv workspace (no [project] table; it is not a
# distribution) holding what every agent shares. Each agent under agents/ is
# its own package with its own pyproject.toml, which owns that agent's mypy,
# pytest and coverage configuration and extends the ruff defaults below.
# See ARCHITECTURE.md.

[tool.uv.workspace]
# Every agent and every example is a member just by existing: adding one
# needs no edit here.
members = ["agents/*", "examples/*"]

[dependency-groups]
# Development tooling, installed by `uv sync` and pinned in uv.lock.
dev = [
    "build>=1.2",
    "mypy>=2.0",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.16",
    "twine>=6.0",
]

# Repository-wide ruff defaults. An agent's pyproject.toml inherits them with
# `extend = "../../pyproject.toml"` and adds only what is specific to it.
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "D",        # pydocstyle (Google convention, see below)
    "UP",       # pyupgrade
    "ANN",      # type annotations
    "B",        # flake8-bugbear
    "BLE",      # blind except
    "C4",       # comprehensions
    "SIM",      # simplify
    "RET",      # return statements
    "PTH",      # prefer pathlib
    "PT",       # pytest style
    "PL",       # pylint (includes PLR0912 branches and PLR0915 statements)
    "C90",      # mccabe complexity
    "RUF",      # ruff-specific
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: literal expectations, white-box helpers, and duck-typed fakes whose
# methods implement well-known protocols (read/readable/seekable, clients).
"**/tests/**" = ["PLR2004", "PLC2701", "ANN401", "D102", "D107"]
