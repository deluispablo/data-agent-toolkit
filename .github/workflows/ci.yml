name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents:
    # Every agents/<name>/pyproject.toml is an agent: the jobs below run once
    # per agent, so adding one needs no change to this workflow.
    name: Discover agents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agents: ${{ steps.discover.outputs.agents }}
    steps:
      - uses: actions/checkout@v7
      - id: discover
        # The runner's system Python (3.11+) has tomllib.
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, pathlib, tomllib

          agents = []
          for pyproject in sorted(pathlib.Path("agents").glob("*/pyproject.toml")):
              project = tomllib.loads(pyproject.read_text(encoding="utf-8"))["project"]
              extras = ",".join(project.get("optional-dependencies", {}))
              agents.append({"name": pyproject.parent.name, "extras": extras})
          print(f"agents={json.dumps(agents)}")
          EOF

  examples:
    # Every examples/<name>/pyproject.toml is an example: executable
    # documentation, never built or released, so it gets a lighter job set
    # than an agent (type-check and tests on one Python, no packaging).
    name: Discover examples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      examples: ${{ steps.discover.outputs.examples }}
    steps:
      - uses: actions/checkout@v7
      - id: discover
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, pathlib

          examples = [
              {"name": pyproject.parent.name}
              for pyproject in sorted(pathlib.Path("examples").glob("*/pyproject.toml"))
          ]
          print(f"examples={json.dumps(examples)}")
          EOF

  lint:
    name: Lint & lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      # --locked fails if uv.lock is out of date with any pyproject.toml.
      - run: uv sync --locked --all-packages --all-extras
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  typecheck:
    name: Type-check (${{ matrix.agent.name }})
    needs: agents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.agents.outputs.agents) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras
      - run: uv run --directory "agents/${{ matrix.agent.name }}" mypy

  test:
    name: Tests (${{ matrix.agent.name }}, Python ${{ matrix.python-version }}, ${{ matrix.os }})
    needs: agents
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.agents.outputs.agents) }}
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Windows runs on the newest Python only: it guards the byte-exact
        # fixtures against CRLF conversion and Windows-specific paths.
        exclude:
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras
      # Coverage floor: [tool.coverage.report] fail_under in the agent's pyproject.toml.
      - run: uv run --directory "agents/${{ matrix.agent.name }}" pytest --cov
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: uv run --directory "agents/${{ matrix.agent.name }}" coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  test-lowest:
    # The jobs above test the versions pinned in uv.lock, so a dependency
    # floor that is too low would never fail them. This job installs the
    # lowest versions each agent's pyproject.toml allows for its direct
    # dependencies, on the oldest supported Python, and runs the tests.
    name: Tests, lowest dependencies (${{ matrix.agent.name }})
    needs: agents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.agents.outputs.agents) }}
    env:
      AGENT: ${{ matrix.agent.name }}
      EXTRAS: ${{ matrix.agent.extras }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install the lowest direct dependency versions
        run: |
          uv venv --python 3.10 "$RUNNER_TEMP/lowest-venv"
          export VIRTUAL_ENV="$RUNNER_TEMP/lowest-venv"
          uv pip install --resolution lowest-direct "./agents/$AGENT${EXTRAS:+[$EXTRAS]}"
          uv pip install pytest
          uv pip list
      - name: Run the tests
        working-directory: agents/${{ matrix.agent.name }}
        run: '"$RUNNER_TEMP/lowest-venv/bin/python" -m pytest'

  package:
    # Builds each agent exactly as a consumer receives it and installs it with
    # plain pip into fresh virtual environments, without the repository on the
    # path, then runs the agent's scripts/smoke_test_installed.py from outside.
    name: Package (${{ matrix.agent.name }}, Python ${{ matrix.python-version }})
    needs: agents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.agents.outputs.agents) }}
        python-version: ["3.10", "3.14"]
    env:
      AGENT: ${{ matrix.agent.name }}
      EXTRAS: ${{ matrix.agent.extras }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir dist "agents/$AGENT"
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Install the wheel (no extras) into a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl
      - name: Install the sdist with every extra into a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          sdist="$(ls "$PWD"/dist/*.tar.gz)"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install "$sdist${EXTRAS:+[$EXTRAS]}"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip check
      - name: Smoke-test both installations from outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          cp "$GITHUB_WORKSPACE/agents/$AGENT/scripts/smoke_test_installed.py" .
          "$RUNNER_TEMP/wheel-venv/bin/python" smoke_test_installed.py
          "$RUNNER_TEMP/sdist-venv/bin/python" smoke_test_installed.py

  examples-typecheck:
    name: Type-check example (${{ matrix.example.name }})
    needs: examples
    # An empty matrix is an error in GitHub Actions: skip when there is no example.
    if: needs.examples.outputs.examples != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.examples.outputs.examples) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras
      - run: uv run --directory "examples/${{ matrix.example.name }}" mypy

  examples-test:
    # Examples are not shipped: one Python on Linux is enough. They run on
    # every pull request, since they test the agents' current source.
    name: Tests example (${{ matrix.example.name }})
    needs: examples
    if: needs.examples.outputs.examples != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.examples.outputs.examples) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras
      # Coverage floor: [tool.coverage.report] fail_under in the example's pyproject.toml.
      - run: uv run --directory "examples/${{ matrix.example.name }}" pytest --cov
      - name: Coverage summary
        run: uv run --directory "examples/${{ matrix.example.name }}" coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
