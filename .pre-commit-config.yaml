# The checks CI runs, before each commit. Enable with: uv run pre-commit install
#
# Every hook is local and runs through uv, so tool versions come from uv.lock
# (no second set of pinned versions to keep in sync here).
repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: uv.lock matches every pyproject.toml
        entry: uv lock --check
        language: system
        files: (^|/)pyproject\.toml$|^uv\.lock$
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]

      # mypy runs per agent, with that agent's configuration: one hook each.
      - id: mypy-csv-inspector
        name: mypy (csv_inspector)
        entry: uv run --frozen --directory agents/csv_inspector mypy
        language: system
        files: ^agents/csv_inspector/.*\.py$
        pass_filenames: false
